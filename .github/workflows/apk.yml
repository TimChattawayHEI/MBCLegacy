name: Build the APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the game inside the app
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r web android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www/fb
          for f in firebase-app-compat.js firebase-database-compat.js; do
            curl -sSLf "https://www.gstatic.com/firebasejs/10.12.2/$f" -o "android/app/src/main/assets/www/fb/$f"
          done

      - name: Build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --no-daemon 2>&1 | tee build.log

      - name: Show what went wrong
        if: failure()
        working-directory: android
        run: |
          msg=$(grep -E -A12 "What went wrong|error:|e: " build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"

      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk MBC-Legacies.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MBC-Legacies
          path: MBC-Legacies.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MBC Legacies 1.${{ github.run_number }}
          body: |
            Download **MBC-Legacies.apk** below and open it on your Android phone.
            First time: your phone will ask to allow installs from your browser or files app. Say yes.
            Updating: just install the new one over the top.
          files: MBC-Legacies.apk
          make_latest: true
