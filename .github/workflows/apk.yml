name: Build the APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the game inside the app
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r web android/app/src/main/assets/www

      - name: Build
        working-directory: android
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --no-daemon

      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk MBC-Legacies.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MBC-Legacies
          path: MBC-Legacies.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MBC Legacies 1.${{ github.run_number }}
          body: |
            Download **MBC-Legacies.apk** below and open it on your Android phone.
            First time: your phone will ask to allow installs from your browser or files app. Say yes.
            Updating: just install the new one over the top.
          files: MBC-Legacies.apk
          make_latest: true
