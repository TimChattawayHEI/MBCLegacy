    <div id="t3" hidden>
      <canvas id="t3cv" width="480" height="270" aria-label="Title screen: the camera flies down a dusk high street and the seven lads run in"></canvas>

      <div class="t3ov t3out" id="t3-start">PRESS START</div>
      <div class="t3ov" id="t3-tag">SEVEN LADS.&nbsp; THREE TRIPS.&nbsp; ONE BIG CARP.</div>
      <nav class="t3sel" id="t3-crumbs" aria-label="Steps"><span data-step="lad">1 LAD</span><i></i><span data-step="stage">2 STAGE</span><i></i><span data-step="diff">3 DIFFICULTY</span></nav>

      <div class="t3sel" id="t3-roster" role="group" aria-label="Lads"></div>
      <section class="t3sel t3panel" id="t3-stages"><div id="t3-tabs" role="tablist" aria-label="Chapters"></div><ol id="t3-list"></ol></section>

        <p class="t3txt" id="t3-ssub" style="color:var(--t3grey)"></p>
